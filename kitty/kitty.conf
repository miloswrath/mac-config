# Translated from nix-conf 9aead75978c9b7782fb66aff716fd54ec1919d71.
include themes/Catppuccin-Mocha.conf

font_family JetBrainsMono Nerd Font
font_size 12.0

# A login shell obtains Homebrew's environment before starting tmux on macOS.
shell zsh --login -c 'exec tmux'
editor nvim

cursor_trail 3
cursor_trail_decay 0.08 0.3
cursor_trail_start_threshold 4
strip_trailing_spaces smart
macos_option_as_alt yes
macos_quit_when_last_window_closed yes
copy_on_select yes
confirm_os_window_close 0
scrollback_lines 10000
enable_audio_bell no
mouse_hide_wait 60
update_check_interval 0

tab_title_template {index}
active_tab_font_style normal
inactive_tab_font_style normal
tab_bar_style powerline
tab_powerline_style round
active_tab_foreground #1e1e2e
active_tab_background #cba6f7
inactive_tab_foreground #bac2de
inactive_tab_background #313244

map ctrl+alt+n launch --cwd=current
map alt+w copy_and_clear_or_interrupt
map ctrl+y paste_from_clipboard
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+0 goto_tab 10

# A Kitty overlay isn't a tmux pane; select the calling pane's client explicitly.
map ctrl+t launch --cwd=current --type=overlay zsh -lc 'exec bash "$HOME/.config/tmux/scripts/tmux-sessionizer" --kitty-overlay "$1"' kitty-project-picker @active-kitty-window-id
map ctrl+shift+left no_op
map ctrl+shift+right no_op
